// ElasticMQ config, mounted into the elasticmq container by docker-compose.yml.
// Defines the queues as infrastructure, the way a real deployment would
// provision them with Terraform - the application resolves them by name and
// never creates them.
include classpath("application.conf")

node-address {
    protocol = http
    host = "*"
    port = 9324
    context-path = ""
}

rest-sqs {
    enabled = true
    bind-port = 9324
    bind-hostname = "0.0.0.0"
    // Returns this host in queue URLs so the application (running outside
    // the elasticmq container) gets an address it can actually reach.
    sqs-limits = strict
}

queues {
    notifications {
        defaultVisibilityTimeout = 30 seconds
        delay = 0 seconds
        receiveMessageWait = 0 seconds
        deadLettersQueue {
            name = "notifications-dlq"
            maxReceiveCount = 5
        }
    }
    notifications-dlq {
        defaultVisibilityTimeout = 30 seconds
    }
}
