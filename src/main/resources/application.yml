spring:
  application:
    name: subscription-hub
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

server:
  port: 8080

auth:
  jwt:
    # HS256 requires at least 32 bytes; JwtConfig fails at startup below that
    # rather than at the first login attempt.
    secret: ${JWT_SECRET}
    ttl: 1h

billing:
  cycle:
    cron: "0 0 * * * *"   # hourly, on the hour - invoices then renews each due subscription
  invoice:
    due-days: 14
  pdf:
    bucket: invoices
    endpoint: http://localhost:9000
    access-key: ${MINIO_ROOT_USER}
    secret-key: ${MINIO_ROOT_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info,httptrace

logging:
  pattern:
    level: "%5p [tenant:%X{tenantId:-?} req:%X{requestId:-?}]"
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg tenant=%X{tenant} requestId=%X{requestId}%n"
  level:
    root: INFO
    org.springframework: INFO
