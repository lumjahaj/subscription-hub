spring:
  application:
    name: subscription-hub
  # Graceful shutdown needs a bound on how long in-flight work may take.
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    # A managed database hands you one complete URL, so the whole thing is
    # overridable rather than only the database name.
    #
    # If that managed database offers a pooled endpoint, DO NOT USE IT.
    # TenantAwareDataSource binds app.tenant_id as a session-level setting on
    # every connection borrow (SET LOCAL cannot work: Spring borrows the
    # connection before it issues BEGIN). A transaction-mode pooler - which is
    # what Neon's and Supabase's pooled endpoints are - hands a different
    # backend to each transaction, so the setting lands on one and the query
    # runs on another. Every row-level security policy then reads an unbound
    # app.tenant_id and returns nothing. Not an error: silent, intermittent,
    # empty results on financial data.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB}}
    # Not POSTGRES_USER. That role is a superuser and owns every table, and
    # Postgres exempts both from row-level security - so the policies would be
    # in place and protect nothing. This role is neither, and is NOBYPASSRLS.
    # Its name is fixed because db/migration grants and policies name it; only
    # the password is configurable. Created by
    # docker/postgres/init/01-app-role.sh - which is the Postgres image's
    # init-script convention, so a managed database has no equivalent and
    # needs the same SQL run by hand before first boot, or V20's grants fail
    # at startup.
    username: subscription_hub_app
    password: ${POSTGRES_APP_PASSWORD}
    hikari:
      # Hikari's own defaults, made overridable. minimum-idle is the one that
      # matters on a database that bills for uptime or scales to zero: held
      # idle connections keep it awake indefinitely.
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
  jpa:
    # Off, so a request holds a Hibernate session - and, under the
    # DELAYED_ACQUISITION_AND_HOLD mode Spring configures, its JDBC connection -
    # only for the transactions it runs, not until the response is written.
    # With it on, PaymentService's provider call and PDF streaming held a pool
    # connection for their whole duration even with no transaction open. The
    # cost is that every association a response reads must be loaded
    # explicitly: see the @EntityGraph finders and InvoiceRepositoryImpl.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    # Migrations run as the schema owner, not as the application's role.
    #
    # Without FORCE ROW LEVEL SECURITY the owner is exempt from the policies,
    # which is exactly what a migration needs: V3's
    # "UPDATE plan SET interval_unit = ..." rewrites every tenant's rows, and
    # under the policies it would silently update none. Keeping the two roles
    # apart is what lets the policies be strict.
    #
    # The url is given explicitly rather than left to Boot: with only a user
    # set, FlywayAutoConfiguration derives a DataSource from the application's
    # one, which it would first have to unwrap past TenantAwareDataSource.
    url: ${spring.datasource.url}
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    # Schema only. Seed data lives in db/seed and is added to this list by
    # the dev profile below - migrations run in every environment, so
    # anything with a public password must not be reachable from here.
    locations: classpath:db/migration
    baseline-on-migrate: true
    # A database seeded under the dev profile records db/seed's migrations
    # in flyway_schema_history. Starting the same database without the
    # profile then leaves history entries with no corresponding file, which
    # validate treats as an error. This makes that non-fatal, so a dev
    # database can be started either way.
    ignore-migration-patterns: "*:missing"
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    # Empty locally: Mailpit accepts unauthenticated plain SMTP on 1025. A real
    # relay needs all four of these together - credentials, auth on, STARTTLS
    # on, port 587. This block used to claim a real SES integration was "a
    # config change, not a code one" while hardcoding both booleans and
    # plumbing no credentials at all, which made the claim false. It is true
    # now.
    #
    # SES's SMTP username and password are generated in the SES console and are
    # NOT an IAM access key and secret.
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
  cloud:
    aws:
      region:
        static: ${AWS_REGION:eu-central-1}
      credentials:
        # Static and empty-safe by default: ElasticMQ ignores credentials
        # entirely, so a clean clone needs none to run the queue locally.
        # Real SQS needs real ones, supplied the same way as everywhere else.
        #
        # Beware: these are always injected, so the "test" default would
        # override an EC2 instance role, or anything else the SDK's credential
        # chain would otherwise find. Blank them explicitly to use the chain.
        access-key: ${AWS_ACCESS_KEY_ID:test}
        secret-key: ${AWS_SECRET_ACCESS_KEY:test}
      sqs:
        # Empty means the real regional SQS endpoint.
        endpoint: ${SQS_ENDPOINT:http://localhost:9324}

server:
  port: ${SERVER_PORT:8080}
  # Behind a TLS-terminating proxy (a Cloudflare Tunnel, a load balancer) the
  # application only ever sees plain HTTP. Without this, the Location header
  # UriComponentsBuilder puts on every 201 comes back as http:// on an https://
  # site, and a client that follows it goes nowhere.
  forward-headers-strategy: framework
  # Finish in-flight work on SIGTERM rather than cutting it. A scheduled job
  # mid-run is the case that matters: BillingCycleJob killed between invoicing
  # and renewing leaves the subscription due - recoverable, but there is no
  # reason to cause it on every deploy.
  shutdown: graceful

openapi:
  # Where Swagger UI sends "Try it out" requests. A deployed instance must
  # override this, or the UI fires every request at whatever happens to be
  # listening on the reader's own machine.
  server-url: ${OPENAPI_SERVER_URL:http://localhost:8080}

auth:
  jwt:
    # HS256 requires at least 32 bytes; JwtConfig fails at startup below that
    # rather than at the first login attempt.
    secret: ${JWT_SECRET}
    ttl: 1h

platform:
  bootstrap:
    # Creates the first platform administrator at startup, and only while
    # platform_user is empty (PlatformAdminBootstrap). Unset by default: the
    # dev profile gets one from db/seed instead, and a clean clone needs none.
    admin-email: ${PLATFORM_ADMIN_EMAIL:}
    admin-password: ${PLATFORM_ADMIN_PASSWORD:}

billing:
  cycle:
    # hourly, on the hour - invoices then renews each due subscription
    cron: "${BILLING_CYCLE_CRON:0 0 * * * *}"
  invoice:
    due-days: ${BILLING_INVOICE_DUE_DAYS:14}
  pdf:
    bucket: ${STORAGE_BUCKET:invoices}
    # Empty resolves the real endpoint for the region, i.e. AWS S3 proper.
    # MinIO, R2 and Backblaze each need their own value here.
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    # MinIO ignores the region but the SDK refuses to build a client without
    # one; R2 requires the literal "auto"; real S3 wants the bucket's region.
    region: ${STORAGE_REGION:us-east-1}
    # MinIO serves path-style (host/bucket/key). Virtual-host style
    # (bucket.host/key) is the SDK default and needs a DNS entry per bucket.
    path-style: ${STORAGE_PATH_STYLE:true}
    # Named for the store rather than the vendor: MinIO's root credentials
    # locally, an R2 or S3 key pair anywhere else.
    access-key: ${STORAGE_ACCESS_KEY:${MINIO_ROOT_USER}}
    secret-key: ${STORAGE_SECRET_KEY:${MINIO_ROOT_PASSWORD}}

payment:
  # fake: in-process, no network or secrets - the default, and what tests use.
  # stripe: the real API, which additionally needs stripe.secret-key below.
  provider: ${PAYMENT_PROVIDER:fake}
  reconciliation:
    # Offset again from billing (:00) and dunning (:15), so the three jobs
    # never overlap on the same invoice.
    cron: "${PAYMENT_RECONCILIATION_CRON:0 30 * * * *}"
    # How long a payment may sit PENDING before we go and ask the provider
    # about it. Below this it is simply mid-flight: a webhook is normally
    # seconds away, and reconciling then would race the path that works.
    min-age: 15m
    # Payments asked about per tenant per run. A provider outage can strand a
    # whole run's worth at once, and each one costs a call.
    batch-size: 100

dunning:
  cycle:
    # Offset from billing.cycle.cron so collection never runs while the
    # billing cycle is mid-invoice for the same subscription.
    cron: "${DUNNING_CYCLE_CRON:0 15 * * * *}"
  # Gaps after a failed attempt, lengthening: a card declined an hour ago is
  # unlikely to work now, while the same card next week might. The first
  # attempt happens as soon as the invoice is issued, so these are retries.
  retry-delays: 1d,3d,5d
  # Total attempts before the invoice is written off UNCOLLECTIBLE and the
  # subscription canceled. Each attempt costs a provider fee and irritates
  # the customer's bank, so this is deliberately finite.
  max-attempts: 4

notification:
  # Must be deliverable on a real relay: the default is a reserved .test TLD
  # (RFC 2606), which anything but Mailpit rejects at the envelope.
  from: ${NOTIFICATION_FROM:billing@subscription-hub.test}
  # How often the relay moves PENDING outbox rows onto the queue. Every tick is
  # a query per active tenant, so on a database that scales to zero or bills
  # for uptime, this is what keeps it awake. Raise it there.
  relay:
    delay: ${NOTIFICATION_RELAY_DELAY:5000}
  sqs:
    queue: ${NOTIFICATION_SQS_QUEUE:notifications}

stripe:
  # Only read when payment.provider=stripe; StripeConfig then refuses to
  # start if the key is blank. Empty defaults so the application still boots
  # from a clean clone with no Stripe account (CLAUDE.md §2).
  secret-key: ${STRIPE_SECRET_KEY:}
  # Verifies webhook signatures. Printed by `stripe listen`, or found in the
  # Stripe dashboard's webhook settings.
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  # Empty means the real Stripe API. Point it at a local stripe-mock
  # (http://localhost:12111) to exercise the adapter without an account.
  api-base: ${STRIPE_API_BASE:}

management:
  endpoints:
    web:
      exposure:
        # httptrace removed: it is a Spring Boot 2 endpoint id (renamed to
        # httpexchanges in Boot 3) and additionally needs an
        # HttpExchangeRepository bean that nothing here defines, so it has
        # been doing nothing. Deleted rather than repaired - that endpoint
        # records request and response headers, which now means bearer
        # tokens would sit in a queryable endpoint.
        # prometheus is readable only by the scrape account
        # (MetricsSecurityConfig), never by a tenant or platform token.
        include: health,info,prometheus
  endpoint:
    health:
      # Explicit even though `never` is the default, so a later change to
      # `always` can't quietly start publishing database and disk internals
      # to an unauthenticated probe.
      show-details: when-authorized
      # /actuator/health/liveness and /readiness. Boot turns these on by
      # itself only on Kubernetes. Readiness matters here: Boot accepts HTTP
      # before ApplicationRunners (PlatformAdminBootstrap) finish, and
      # readiness only reports UP after them, so anything that routes traffic
      # on it never sends a request too early.
      probes:
        enabled: true
  metrics:
    distribution:
      # Publishes latency as histogram buckets, so p95/p99 can be computed in
      # Prometheus across the whole service. Client-side percentiles cannot be
      # aggregated across instances or over time.
      percentiles-histogram:
        http.server.requests: true
    tags:
      # On every meter, so one Prometheus can tell this service's series
      # apart from anything else it scrapes.
      application: ${spring.application.name}

# The one account allowed to read /actuator/prometheus. Both empty by default:
# metrics are then unreadable (401) rather than open, and a clean clone needs
# no secret. See MetricsScrapeCredential for the rules.
metrics:
  scrape:
    username: ${METRICS_SCRAPE_USERNAME:}
    password: ${METRICS_SCRAPE_PASSWORD:}

logging:
  pattern:
    # The MDC keys are MdcKeys.TENANT_ID ("tenantId") and REQUEST_ID. This
    # used to read %X{tenant}, a key nothing sets, so every line logged an
    # empty tenant. A separate `level` pattern also existed and was never
    # used: it only applies through %5p in Boot's default pattern, which this
    # one replaces.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg tenant=%X{tenantId} requestId=%X{requestId}%n"
  level:
    root: INFO
    org.springframework: INFO

---
# Development profile. Deliberately NOT the default: an environment that
# forgets to set a profile gets no seeded logins, rather than silently
# inheriting an admin account whose password is in the repository. Safety
# over convenience, since the failure mode of the reverse is invisible.
#
# Local: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# Tests: AbstractIntegrationTest activates it via @ActiveProfiles.
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed
    # Seeds are numbered V9000+ so they can never interleave with a schema
    # version - but that also means a dev database has a *higher* version
    # recorded than any schema migration. Flyway then treats every new
    # schema migration as out of order and, by default, refuses to apply it:
    # "Detected resolved migration not applied to database: 11". Allowed
    # here only, because only a seeded database can be in that state; the
    # default profile keeps the strict ordering, where an unexpectedly
    # out-of-order migration is a real signal.
    out-of-order: true

---
# Deployed profile: the application running against managed services instead of
# docker-compose.
#
# Not called "prod". This is a single instance on free tiers, and the name a
# real production environment would want is left unclaimed. Not "stage" either,
# which reads as a pipeline step, nor "demo", which collides with the seeded
# demo tenant - a log line saying profile=demo tenant=demo helps nobody.
#
# It carries almost nothing on purpose. Everything that differs between a
# laptop and a deployed host is an environment variable above, so only the two
# things that cannot be expressed that way live here.
spring:
  config:
    activate:
      on-profile: staging
  flyway:
    # Schema only. db/seed carries publicly known passwords.
    locations: classpath:db/migration
    # Strict, unlike dev: nothing here can legitimately be out of order, so an
    # out-of-order migration is a real signal rather than an expected state.
    out-of-order: false

springdoc:
  # The API's shape, and the existence of every endpoint, is not public
  # information on a reachable host. Swagger stays on locally, where it is the
  # primary way the API is explored.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
