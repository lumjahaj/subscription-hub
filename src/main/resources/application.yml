spring:
  application:
    name: subscription-hub
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    # Schema only. Seed data lives in db/seed and is added to this list by
    # the dev profile below - migrations run in every environment, so
    # anything with a public password must not be reachable from here.
    locations: classpath:db/migration
    baseline-on-migrate: true
    # A database seeded under the dev profile records db/seed's migrations
    # in flyway_schema_history. Starting the same database without the
    # profile then leaves history entries with no corresponding file, which
    # validate treats as an error. This makes that non-fatal, so a dev
    # database can be started either way.
    ignore-migration-patterns: "*:missing"
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

server:
  port: 8080

auth:
  jwt:
    # HS256 requires at least 32 bytes; JwtConfig fails at startup below that
    # rather than at the first login attempt.
    secret: ${JWT_SECRET}
    ttl: 1h

billing:
  cycle:
    cron: "0 0 * * * *"   # hourly, on the hour - invoices then renews each due subscription
  invoice:
    due-days: 14
  pdf:
    bucket: invoices
    endpoint: http://localhost:9000
    access-key: ${MINIO_ROOT_USER}
    secret-key: ${MINIO_ROOT_PASSWORD}

payment:
  # fake: in-process, no network or secrets - the default, and what tests use.
  # stripe: the real API, which additionally needs stripe.secret-key below.
  provider: fake

stripe:
  # Only read when payment.provider=stripe; StripeConfig then refuses to
  # start if the key is blank. Empty defaults so the application still boots
  # from a clean clone with no Stripe account (CLAUDE.md §2).
  secret-key: ${STRIPE_SECRET_KEY:}
  # Verifies webhook signatures. Printed by `stripe listen`, or found in the
  # Stripe dashboard's webhook settings.
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  # Empty means the real Stripe API. Point it at a local stripe-mock
  # (http://localhost:12111) to exercise the adapter without an account.
  api-base: ${STRIPE_API_BASE:}

management:
  endpoints:
    web:
      exposure:
        # httptrace removed: it is a Spring Boot 2 endpoint id (renamed to
        # httpexchanges in Boot 3) and additionally needs an
        # HttpExchangeRepository bean that nothing here defines, so it has
        # been doing nothing. Deleted rather than repaired - that endpoint
        # records request and response headers, which now means bearer
        # tokens would sit in a queryable endpoint.
        include: health,info
  endpoint:
    health:
      # Explicit even though `never` is the default, so a later change to
      # `always` can't quietly start publishing database and disk internals
      # to an unauthenticated probe.
      show-details: when-authorized

logging:
  pattern:
    level: "%5p [tenant:%X{tenantId:-?} req:%X{requestId:-?}]"
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg tenant=%X{tenant} requestId=%X{requestId}%n"
  level:
    root: INFO
    org.springframework: INFO

---
# Development profile. Deliberately NOT the default: an environment that
# forgets to set a profile gets no seeded logins, rather than silently
# inheriting an admin account whose password is in the repository. Safety
# over convenience, since the failure mode of the reverse is invisible.
#
# Local: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# Tests: AbstractIntegrationTest activates it via @ActiveProfiles.
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed
    # Seeds are numbered V9000+ so they can never interleave with a schema
    # version - but that also means a dev database has a *higher* version
    # recorded than any schema migration. Flyway then treats every new
    # schema migration as out of order and, by default, refuses to apply it:
    # "Detected resolved migration not applied to database: 11". Allowed
    # here only, because only a seeded database can be in that state; the
    # default profile keeps the strict ordering, where an unexpectedly
    # out-of-order migration is a real signal.
    out-of-order: true
