spring:
  application:
    name: subscription-hub
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    # Schema only. Seed data lives in db/seed and is added to this list by
    # the dev profile below - migrations run in every environment, so
    # anything with a public password must not be reachable from here.
    locations: classpath:db/migration
    baseline-on-migrate: true
    # A database seeded under the dev profile records db/seed's migrations
    # in flyway_schema_history. Starting the same database without the
    # profile then leaves history entries with no corresponding file, which
    # validate treats as an error. This makes that non-fatal, so a dev
    # database can be started either way.
    ignore-migration-patterns: "*:missing"
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          # Mailpit and SES's SMTP interface both accept plain SMTP on these
          # ports in this setup; a real SES integration would enable
          # STARTTLS and move to port 587 - a config change, not a code one.
          auth: false
          starttls:
            enable: false
  cloud:
    aws:
      region:
        static: ${AWS_REGION:eu-central-1}
      credentials:
        # Static and empty-safe by default: ElasticMQ ignores credentials
        # entirely, so a clean clone needs none to run the queue locally.
        # Real SQS needs real ones, supplied the same way as everywhere else.
        access-key: ${AWS_ACCESS_KEY_ID:test}
        secret-key: ${AWS_SECRET_ACCESS_KEY:test}
      sqs:
        endpoint: ${SQS_ENDPOINT:http://localhost:9324}

server:
  port: 8080

auth:
  jwt:
    # HS256 requires at least 32 bytes; JwtConfig fails at startup below that
    # rather than at the first login attempt.
    secret: ${JWT_SECRET}
    ttl: 1h

platform:
  bootstrap:
    # Creates the first platform administrator at startup, and only while
    # platform_user is empty (PlatformAdminBootstrap). Unset by default: the
    # dev profile gets one from db/seed instead, and a clean clone needs none.
    admin-email: ${PLATFORM_ADMIN_EMAIL:}
    admin-password: ${PLATFORM_ADMIN_PASSWORD:}

billing:
  cycle:
    cron: "0 0 * * * *"   # hourly, on the hour - invoices then renews each due subscription
  invoice:
    due-days: 14
  pdf:
    bucket: invoices
    endpoint: http://localhost:9000
    access-key: ${MINIO_ROOT_USER}
    secret-key: ${MINIO_ROOT_PASSWORD}

payment:
  # fake: in-process, no network or secrets - the default, and what tests use.
  # stripe: the real API, which additionally needs stripe.secret-key below.
  provider: fake

dunning:
  cycle:
    # Offset from billing.cycle.cron so collection never runs while the
    # billing cycle is mid-invoice for the same subscription.
    cron: "0 15 * * * *"
  # Gaps after a failed attempt, lengthening: a card declined an hour ago is
  # unlikely to work now, while the same card next week might. The first
  # attempt happens as soon as the invoice is issued, so these are retries.
  retry-delays: 1d,3d,5d
  # Total attempts before the invoice is written off UNCOLLECTIBLE and the
  # subscription canceled. Each attempt costs a provider fee and irritates
  # the customer's bank, so this is deliberately finite.
  max-attempts: 4

notification:
  from: billing@subscription-hub.test
  # How often the relay moves PENDING outbox rows onto the queue.
  relay:
    delay: 5000
  sqs:
    queue: notifications

stripe:
  # Only read when payment.provider=stripe; StripeConfig then refuses to
  # start if the key is blank. Empty defaults so the application still boots
  # from a clean clone with no Stripe account (CLAUDE.md §2).
  secret-key: ${STRIPE_SECRET_KEY:}
  # Verifies webhook signatures. Printed by `stripe listen`, or found in the
  # Stripe dashboard's webhook settings.
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  # Empty means the real Stripe API. Point it at a local stripe-mock
  # (http://localhost:12111) to exercise the adapter without an account.
  api-base: ${STRIPE_API_BASE:}

management:
  endpoints:
    web:
      exposure:
        # httptrace removed: it is a Spring Boot 2 endpoint id (renamed to
        # httpexchanges in Boot 3) and additionally needs an
        # HttpExchangeRepository bean that nothing here defines, so it has
        # been doing nothing. Deleted rather than repaired - that endpoint
        # records request and response headers, which now means bearer
        # tokens would sit in a queryable endpoint.
        # prometheus is readable only by the scrape account
        # (MetricsSecurityConfig), never by a tenant or platform token.
        include: health,info,prometheus
  endpoint:
    health:
      # Explicit even though `never` is the default, so a later change to
      # `always` can't quietly start publishing database and disk internals
      # to an unauthenticated probe.
      show-details: when-authorized
      # /actuator/health/liveness and /readiness. Boot turns these on by
      # itself only on Kubernetes. Readiness matters here: Boot accepts HTTP
      # before ApplicationRunners (PlatformAdminBootstrap) finish, and
      # readiness only reports UP after them, so anything that routes traffic
      # on it never sends a request too early.
      probes:
        enabled: true
  metrics:
    distribution:
      # Publishes latency as histogram buckets, so p95/p99 can be computed in
      # Prometheus across the whole service. Client-side percentiles cannot be
      # aggregated across instances or over time.
      percentiles-histogram:
        http.server.requests: true
    tags:
      # On every meter, so one Prometheus can tell this service's series
      # apart from anything else it scrapes.
      application: ${spring.application.name}

# The one account allowed to read /actuator/prometheus. Both empty by default:
# metrics are then unreadable (401) rather than open, and a clean clone needs
# no secret. See MetricsScrapeCredential for the rules.
metrics:
  scrape:
    username: ${METRICS_SCRAPE_USERNAME:}
    password: ${METRICS_SCRAPE_PASSWORD:}

logging:
  pattern:
    # The MDC keys are MdcKeys.TENANT_ID ("tenantId") and REQUEST_ID. This
    # used to read %X{tenant}, a key nothing sets, so every line logged an
    # empty tenant. A separate `level` pattern also existed and was never
    # used: it only applies through %5p in Boot's default pattern, which this
    # one replaces.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg tenant=%X{tenantId} requestId=%X{requestId}%n"
  level:
    root: INFO
    org.springframework: INFO

---
# Development profile. Deliberately NOT the default: an environment that
# forgets to set a profile gets no seeded logins, rather than silently
# inheriting an admin account whose password is in the repository. Safety
# over convenience, since the failure mode of the reverse is invisible.
#
# Local: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# Tests: AbstractIntegrationTest activates it via @ActiveProfiles.
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed
    # Seeds are numbered V9000+ so they can never interleave with a schema
    # version - but that also means a dev database has a *higher* version
    # recorded than any schema migration. Flyway then treats every new
    # schema migration as out of order and, by default, refuses to apply it:
    # "Detected resolved migration not applied to database: 11". Allowed
    # here only, because only a seeded database can be in that state; the
    # default profile keeps the strict ordering, where an unexpectedly
    # out-of-order migration is a real signal.
    out-of-order: true
