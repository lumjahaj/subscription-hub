<!DOCTYPE html>
<!--
    Rendered to PDF by InvoicePdfRenderer via openhtmltopdf, not served to
    a browser - this project has no MVC view layer. openhtmltopdf parses
    XHTML strictly, so void elements must be self-closed (<br />, not <br>)
    and every tag must be balanced.

    Every value here is already a formatted String from InvoicePdfView;
    the template deliberately does no arithmetic and no formatting, so the
    integer-cents money rule has exactly one exit point (see the renderer).
-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="'Invoice ' + ${invoice.number}">Invoice</title>
    <style>
        @page { size: A4; margin: 20mm; }
        body { font-family: sans-serif; font-size: 11pt; color: #222; }
        h1 { font-size: 20pt; margin: 0 0 4mm 0; }
        .meta { width: 100%; margin-bottom: 8mm; }
        .meta td { padding: 1mm 0; vertical-align: top; }
        .meta .label { color: #666; width: 30mm; }
        .status { font-weight: bold; }
        table.lines { width: 100%; border-collapse: collapse; margin-top: 4mm; }
        table.lines th, table.lines td { padding: 2mm; border-bottom: 1px solid #ddd; }
        table.lines th { text-align: left; background: #f4f4f4; font-size: 9pt;
                         text-transform: uppercase; letter-spacing: 0.5pt; color: #555; }
        .num { text-align: right; }
        .kind { color: #666; font-size: 9pt; }
        tr.total td { border-bottom: none; border-top: 2px solid #333;
                      font-weight: bold; font-size: 12pt; padding-top: 3mm; }
        .footer { margin-top: 12mm; font-size: 9pt; color: #888; }
    </style>
</head>
<body>

<h1 th:text="'Invoice ' + ${invoice.number}">Invoice INV-000001</h1>

<table class="meta">
    <tr>
        <td class="label">Status</td>
        <td class="status" th:text="${invoice.status}">OPEN</td>
        <td class="label">Billed to</td>
        <td th:text="${invoice.customerName}">Customer Name</td>
    </tr>
    <tr>
        <td class="label">Issued</td>
        <td th:text="${invoice.issuedAt}">2026-01-01</td>
        <td class="label"></td>
        <td th:text="${invoice.customerEmail}">customer@example.com</td>
    </tr>
    <tr>
        <td class="label">Due</td>
        <td th:text="${invoice.dueAt}">2026-01-15</td>
        <td class="label">Period</td>
        <td th:text="${invoice.periodStart} + ' to ' + ${invoice.periodEnd}">2026-01-01 to 2026-02-01</td>
    </tr>
</table>

<table class="lines">
    <thead>
    <tr>
        <th>Description</th>
        <th class="num">Quantity</th>
        <th class="num">Unit price</th>
        <th class="num">Amount</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="line : ${invoice.lines}">
        <td>
            <span th:text="${line.description}">Plan name</span><br />
            <span class="kind" th:text="${line.kind}">BASE</span>
        </td>
        <td class="num" th:text="${line.quantity}">1</td>
        <td class="num" th:text="${line.unitAmount} + ' ' + ${invoice.currency}">29.99 USD</td>
        <td class="num" th:text="${line.amount} + ' ' + ${invoice.currency}">29.99 USD</td>
    </tr>
    <tr class="total">
        <td colspan="3">Total</td>
        <td class="num" th:text="${invoice.total} + ' ' + ${invoice.currency}">32.49 USD</td>
    </tr>
    </tbody>
</table>

<!--
    One expression rather than text around an inline <span>: openhtmltopdf
    emits each span as a separate text run, so a trailing "." after one
    reorders unpredictably when the PDF is parsed back out (it extracted
    as ".USD"). Keeping the sentence in a single th:text keeps the
    rendered and extracted text identical, which the renderer test relies on.
-->
<p class="footer"
   th:text="'Generated by Subscription Hub. Amounts are shown in ' + ${invoice.currency} + '.'">
    Generated by Subscription Hub. Amounts are shown in USD.
</p>

</body>
</html>
