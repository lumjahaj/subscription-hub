<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${subject}">A payment could not be collected</title>
</head>
<body>
<div th:replace="~{layout.html :: layout(~{::section})}">
    <section>
        <p>Hi <span th:text="${customerName}">Customer</span>,</p>
        <p>
            We were unable to collect payment for invoice
            <strong th:text="${invoiceNumber}">INV-000001</strong>
            (<span th:text="${amount} + ' ' + ${currency}">0.00 USD</span>).
        </p>
        <p>We'll try again on <span th:text="${nextAttemptDate}">2026-01-01</span>.
           No action is needed if your payment method is already up to date.</p>
    </section>
</div>
</body>
</html>
