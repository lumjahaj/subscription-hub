version: '3.9'

services:
  postgres:
    image: postgres:17
    container_name: subscription-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Read by init/01-app-role.sh, not by Postgres itself.
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the non-superuser role the application connects as. The image
      # runs everything here once, when the data directory is first
      # initialised - so an existing postgres_data volume will not pick it up.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

  pgadmin:
    # Pinned rather than :latest, same reasoning as s3mock below: an unpinned
    # image only fails the day it's *re*-pulled, which is never on the machine
    # that already has it cached, and always on a fresh clone or CI.
    image: dpage/pgadmin4:9.17
    container_name: subscription-hub-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      - postgres

  # S3-compatible object store for invoice PDFs, standing in for AWS S3 - the
  # application talks to both through the plain AWS SDK with only an endpoint
  # differing, which has now been verified against real S3.
  #
  # s3mock rather than MinIO. MinIO removed its community images from Docker
  # Hub, which broke CI once; the quay.io replacement was then removed too,
  # every tag with it, and broke CI again. Both times a developer machine kept
  # passing from its local image cache while a fresh clone could not even start
  # this file. What is left of MinIO is a Bitnami archive marked legacy and a
  # Chainguard image that publishes only :latest for free, which cannot be
  # pinned - see CLAUDE.md §5.
  #
  # It authenticates nothing, so STORAGE_ACCESS_KEY/SECRET_KEY only have to be
  # non-blank: blank is what selects the AWS credential chain instead.
  # It is also in-memory, so PDFs do not survive a restart - which is why there
  # is no volume here, and is fine because an invoice's PDF is regenerable.
  #
  # The trade against MinIO is the web console that used to be on :9001.
  # Inspect the bucket with the AWS CLI instead:
  #   aws s3 ls s3://invoices --endpoint-url http://localhost:9000 --recursive
  s3mock:
    image: adobe/s3mock:3.12.0
    container_name: subscription-hub-s3mock
    restart: unless-stopped
    environment:
      # Created at startup, so nothing has to provision it. The application
      # would create it lazily on first write anyway (S3InvoicePdfStorage),
      # but having it exist keeps local behaviour closer to a deployed host,
      # where the bucket is infrastructure and STORAGE_CREATE_BUCKET is false.
      initialBuckets: invoices
    ports:
      # Published on 9000 so STORAGE_ENDPOINT keeps its previous value and
      # nothing else has to change; s3mock listens on 9090 inside.
      - "9000:9090"

  # Local SMTP inbox for notification emails. Mailpit is the maintained
  # successor to MailHog (unmaintained, no releases in years) and keeps the
  # same ports: 1025 for SMTP, 8025 for the web inbox its REST API also
  # serves. Stands in for Amazon SES's SMTP interface, which is only a host
  # change away.
  mailpit:
    image: axllent/mailpit:v1.31.1
    container_name: subscription-hub-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # Local SQS. The notification outbox is relayed here and a listener
  # consumes it; ElasticMQ speaks the SQS API, so real SQS is only an
  # endpoint change, the same "vendor is a config value" shape as s3mock/S3.
  # Queues are defined in elasticmq.conf as infrastructure, not created by
  # the application.
  elasticmq:
    image: softwaremill/elasticmq-native:1.6.16
    container_name: subscription-hub-elasticmq
    restart: unless-stopped
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - ./docker/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro

  # Scrapes the application on the host (it is not a compose service) with
  # the dedicated scrape account. prometheus.yml cannot read environment
  # variables, so the entrypoint writes METRICS_SCRAPE_PASSWORD to the file
  # basic_auth.password_file points at, keeping the secret out of the repo.
  # Pinned, like every image here.
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: subscription-hub-prometheus
    restart: unless-stopped
    environment:
      METRICS_SCRAPE_PASSWORD: ${METRICS_SCRAPE_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        printf '%s' "$$METRICS_SCRAPE_PASSWORD" > /tmp/metrics-scrape-password &&
        exec /bin/prometheus
        --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=7d
    # host.docker.internal resolves by itself on Docker Desktop; this makes
    # it resolve on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

  # Dashboards over Prometheus. The datasource and the Subscription Hub
  # dashboard are provisioned from docker/grafana, so a fresh clone opens
  # straight onto them.
  grafana:
    image: grafana/grafana:12.1.1
    container_name: subscription-hub-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
