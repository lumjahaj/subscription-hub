version: '3.9'

services:
  postgres:
    image: postgres:17
    container_name: subscription-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    # Pinned rather than :latest, same reasoning as minio below: an unpinned
    # image only fails the day it's *re*-pulled, which is never on the machine
    # that already has it cached, and always on a fresh clone or CI.
    image: dpage/pgadmin4:9.17
    container_name: subscription-hub-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      - postgres

  # Object storage for invoice PDFs. S3-compatible, so the application
  # talks to it with the AWS SDK and only the endpoint differs from real
  # S3. 9000 is the S3 API the app uses; 9001 is the web console for
  # eyeballing stored objects during development.
  minio:
    # quay.io and a pinned tag: MinIO's Docker Hub repository no longer
    # exists, so `image: minio/minio` only still works on a machine that
    # pulled it before it disappeared - a fresh clone gets "repository does
    # not exist". Pinned rather than :latest so this cannot drift again
    # without the change being visible in a diff.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: subscription-hub-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Local SMTP inbox for notification emails. Mailpit is the maintained
  # successor to MailHog (unmaintained, no releases in years) and keeps the
  # same ports: 1025 for SMTP, 8025 for the web inbox its REST API also
  # serves. Stands in for Amazon SES's SMTP interface, which is only a host
  # change away.
  mailpit:
    image: axllent/mailpit:v1.31.1
    container_name: subscription-hub-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # Local SQS. The notification outbox is relayed here and a listener
  # consumes it; ElasticMQ speaks the SQS API, so real SQS is only an
  # endpoint change, the same "vendor is a config value" shape as MinIO/S3.
  # Queues are defined in elasticmq.conf as infrastructure, not created by
  # the application.
  elasticmq:
    image: softwaremill/elasticmq-native:1.6.16
    container_name: subscription-hub-elasticmq
    restart: unless-stopped
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - ./docker/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro

  # Scrapes the application on the host (it is not a compose service) with
  # the dedicated scrape account. prometheus.yml cannot read environment
  # variables, so the entrypoint writes METRICS_SCRAPE_PASSWORD to the file
  # basic_auth.password_file points at, keeping the secret out of the repo.
  # Pinned, like every image here.
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: subscription-hub-prometheus
    restart: unless-stopped
    environment:
      METRICS_SCRAPE_PASSWORD: ${METRICS_SCRAPE_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        printf '%s' "$$METRICS_SCRAPE_PASSWORD" > /tmp/metrics-scrape-password &&
        exec /bin/prometheus
        --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=7d
    # host.docker.internal resolves by itself on Docker Desktop; this makes
    # it resolve on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

  # Dashboards over Prometheus. The datasource and the Subscription Hub
  # dashboard are provisioned from docker/grafana, so a fresh clone opens
  # straight onto them.
  grafana:
    image: grafana/grafana:12.1.1
    container_name: subscription-hub-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
